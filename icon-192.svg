<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#E8D5B7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="4" y="4" width="184" height="184" rx="36" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <!-- Ink character "墨" -->
  <text x="96" y="118" font-family="serif" font-size="88" font-weight="bold" fill="#2C1810" text-anchor="middle" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">墨</text>
  <!-- Small dots decoration -->
  <circle cx="170" cy="25" r="4" fill="#C9A227"/>
  <circle cx="25" cy="170" r="4" fill="#C9A227"/>
</svg>
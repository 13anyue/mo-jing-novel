<!-- ==================== 游戏启动器 ==================== -->
<div id="gameLauncher" class="launcher-page">
  <div class="launcher-bg-pattern"></div>
  <div class="launcher-title">墨 境</div>
  <div class="launcher-subtitle">AI 视觉小说引擎 v10</div>
  <div class="launcher-menu">
    <button class="launcher-btn launcher-btn-primary" onclick="Launcher.newGame()">
      <svg width="20" height="20"><use href="#icon-game"/></svg>
      开启新篇
    </button>
    <button class="launcher-btn launcher-btn-secondary" onclick="Launcher.loadGame()">
      <svg width="20" height="20"><use href="#icon-import"/></svg>
      续读存档
    </button>
    <button class="launcher-btn launcher-btn-secondary" onclick="Launcher.userMask()">
      <svg width="20" height="20"><use href="#icon-npc"/></svg>
      用户面具
    </button>
    <button class="launcher-btn launcher-btn-secondary" onclick="Launcher.settings()">
      <svg width="20" height="20"><use href="#icon-skills"/></svg>
      系统设置
    </button>
  </div>
    <div style="position:absolute;bottom:24px;font-size:11px;color:var(--text-muted);letter-spacing:2px;">
    墨境 v16
  </div>
</div>

<!-- ==================== 新游戏向导 ==================== -->
<div id="worldWizard" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;background:var(--bg-body);overflow-y:auto;">
  <div style="max-width:800px;margin:0 auto;padding:var(--space-xl);">
    <div style="text-align:center;margin-bottom:var(--space-xl);">
      <h2 style="font-family:var(--font-display);font-size:28px;color:var(--color-primary-dark);">构建你的故事世界</h2>
      <p style="color:var(--text-muted);margin-top:8px;">第 <span id="wizStepNum">1</span> / 4 步</p>
    </div>
    <div id="wizardContent"></div>
    <div style="display:flex;justify-content:space-between;margin-top:var(--space-xl);">
      <button class="btn btn-secondary" id="wizPrev" onclick="Wizard.prev()">上一步</button>
      <button class="btn btn-primary" id="wizNext" onclick="Wizard.next()">下一步</button>
    </div>
  </div>
</div>
